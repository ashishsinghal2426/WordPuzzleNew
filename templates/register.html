{% extends "base.html" %}
{% block title %}Register · WordPuzzle{% endblock %}
{% block container_class %}narrow{% endblock %}
{% block content %}
<div class="card">
  <h1>Create account</h1>
  <form method="post">
    <label for="username">Username</label>
    <input type="text" id="username" name="username" minlength="3" required autofocus>
    <label for="password">Password</label>
    <input type="password" id="password" name="password" minlength="6" required>
    <label for="confirm_password">Confirm password</label>
    <input type="password" id="confirm_password" name="confirm_password" required>
    <label for="level">Level</label>
    <select id="level" name="level">
      <option value="primary">Primary (30 weeks)</option>
      <option value="secondary">Secondary (20 weeks)</option>
    </select>
    <button class="btn btn-block" type="submit">Register</button>
  </form>
  <p class="muted">Already registered? <a href="{{ url_for('login') }}">Log in</a></p>
</div>
{% endblock %}
